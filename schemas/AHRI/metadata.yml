title: AHRI TB Knowledgebase
website:
description: This is a knowledge graph that combines (meta)data from both OMERO (images) and REDCap (clinical data) into a single RDF graph. The knowledge graph is centered around patients, and links to their clinical data, as well as the images taken from them. The RDF graph is generated using a custom Python script that extracts data from both OMERO and REDCap, and then combines it into a single RDF graph using the rdflib library. The resulting RDF graph is then available for querying and analysis.
tags: [ tuberculosis, bioimaging, clinical data, omics, omero, redcap ]
